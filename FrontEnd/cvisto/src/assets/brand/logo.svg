<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141B16"/>
      <stop offset="100%" stop-color="#0B100D"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  <!-- Subtle border -->
  <rect x="0.75" y="0.75" width="126.5" height="126.5" rx="27.25" stroke="#22C55E" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- Glow circle background -->
  <circle cx="64" cy="64" r="48" fill="url(#glowGrad)"/>

  <!-- Circle ring -->
  <circle cx="64" cy="64" r="36" stroke="#22C55E" stroke-width="3.5" stroke-opacity="0.9" filter="url(#glow)"/>

  <!-- Inner dark fill to make the circle look solid -->
  <circle cx="64" cy="64" r="34" fill="#0F1712"/>

  <!-- Bold checkmark -->
  <path
    d="M44 65 L57 78 L84 50"
    stroke="#22C55E"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />
</svg>
